<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Example</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>
    <div class="page">
        <h1>CSS Positioning Example</h1>
        <p>Examples of <strong>static</strong>, <strong>relative</strong>, <strong>absolute</strong>, and <strong>fixed</strong> positioning.</p>

        <div class="box static-box">Static box</div>
        <div class="box relative-box">Relative box</div>

        <div class="frame">
            <div class="box absolute-box">Absolute box</div>
        </div>

        <div class="box fixed-box">Fixed box</div>
    </div>
</body>
</html>
