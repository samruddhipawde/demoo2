<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Grid Layout</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 120px 120px;
      gap: 12px;
      justify-items: center;
      align-items: center;
      padding: 16px;
      background: #f8fafc;
    }

    .grid-item {
      background: #c7d2fe;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      font-weight: 700;
      color: #1e3a8a;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
    <div class="grid-item">Box 5</div>
    <div class="grid-item">Box 6</div>
  </div>
</body>
</html>
