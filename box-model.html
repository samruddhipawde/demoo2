<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fb;
            color: #333;
            padding: 20px;
        }

        .box {
            width: 220px;
            padding: 20px;
            border: 4px solid #3498db;
            margin: 30px auto;
            background-color: #e8f1fb;
        }

        .box p {
            font-size: 14px;
            margin: 0 0 10px;
        }

        .note {
            max-width: 420px;
            margin: 0 auto;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="box">
        <p><strong>Content</strong>: This text is inside the box.</p>
        <p><strong>Padding</strong>: Space between the content and border.</p>
        <p><strong>Border</strong>: Blue edge around the padding.</p>
    </div>

    <div class="note">
        <p>Margin is the space outside the border. In this example, the box has <strong>margin: 30px</strong>, so it sits away from surrounding content.</p>
    </div>
</body>
</html>
