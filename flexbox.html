<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Flexbox Example</title>
  <style>
    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    .item {
      flex: 1 1 140px;
      padding: 16px;
      background: #dbeafe;
      border-radius: 8px;
      text-align: center;
    }

    .item:last-child {
      align-self: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>
</body>
</html>
